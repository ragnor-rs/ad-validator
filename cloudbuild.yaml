steps:
  # Build the bot image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ad-validator-bot', '.']

  # Push the bot image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ad-validator-bot']

  # Deploy the bot to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ad-validator-bot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ad-validator-bot'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ad-validator-bot'
  - 'gcr.io/$PROJECT_ID/ad-validator-scraper' 